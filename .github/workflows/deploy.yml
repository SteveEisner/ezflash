name: Deploy Easy Flash to Vercel
on:
  workflow_dispatch:
  push: {tags: ['v*']}
permissions: {contents: read}
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: easy-flash-dist, path: dist}
      - run: npx vercel deploy dist --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes
        env: {VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}', VERCEL_ORG_ID: '${{ secrets.VERCEL_ORG_ID }}'}
